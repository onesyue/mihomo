# 分叉说明（onesyue/mihomo，2026-08-02）：上游只在 `Alpha` 上跑这套测试，而本
# 分叉的默认分支是 `main` —— 于是这个 workflow 自建仓起**一次都没运行过**
# （Actions runs 总数 = 0），包括本分叉自己新增的回归测试（mmdb 零值守卫、
# listener 生命周期不变量）。分叉带补丁却不跑测试，等于补丁没有回归保护。
# 下面只多加一行 `main`，其余保持与上游一致，减少后续 rebase 冲突面。
name: Test
on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - Alpha
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - Alpha
      - main

jobs:
  test:
    strategy:
      matrix:
        os:
          - 'ubuntu-latest' # amd64 linux
          - 'windows-latest' # amd64 windows
          - 'macos-latest' # arm64 macos
          - 'ubuntu-24.04-arm' # arm64 linux
          - 'windows-11-arm' # arm64 windows
          - 'macos-26-intel' # amd64 macos
        go-version:
          - '1.26'
          - '1.25'
          - '1.24'
          - '1.23'
          - '1.22'
          - '1.21'
          - '1.20'
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      # Fix mingw trying to be smart and converting paths https://github.com/moby/moby/issues/24029#issuecomment-250412919
      MSYS_NO_PATHCONV: true
      # Skip mihomo inbound interop test
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: ${{ matrix.go-version }}

      - name: Verify Go installation
        run: go version

      - name: Verify Go env
        run: go env

      - name: Remove inbound test for macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          rm -rf listener/inbound/*_test.go

      - name: Test
        run: go test ./... -v -count=1

      - name: Test with tag with_gvisor
        run: go test ./... -v -count=1 -tags "with_gvisor"