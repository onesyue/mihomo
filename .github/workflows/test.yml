# 分叉说明：上游模板只监听 `Alpha`。2026-08-02 本 fork 仍以
# `main` 为默认分支时，这里加入 `main` 后回归测试才开始在 fork 运行。
# 默认分支后来迁移为 `master`；保留 `main` 并加入 `master`，避免分支
# 改名让 mmdb 零值守卫和 listener 生命周期等 fork 回归网静默失效。
# 其余保持与上游一致，减少后续 rebase 冲突面。
name: Test
on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - Alpha
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - Alpha
      - main
      - master

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - 'ubuntu-latest' # amd64 linux
          - 'windows-latest' # amd64 windows
          - 'macos-latest' # arm64 macos
          - 'ubuntu-24.04-arm' # arm64 linux
          - 'windows-11-arm' # arm64 windows
          - 'macos-15-intel' # amd64 macos
        go-version:
          - '1.26'
          - '1.25'
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      # Fix mingw trying to be smart and converting paths https://github.com/moby/moby/issues/24029#issuecomment-250412919
      MSYS_NO_PATHCONV: true
      # Skip mihomo inbound interop test
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Verify Go installation
        run: go version

      - name: Verify Go env
        run: go env

      - name: Remove inbound test for macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          rm -rf listener/inbound/*_test.go

      - name: Test
        run: go test ./... -v -count=1

      - name: Test with tag with_gvisor
        run: go test ./... -v -count=1 -tags "with_gvisor"

  race:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
          cache: false

      - name: Race-test fork state and production Vision paths
        run: |
          go test -race ./component/mmdb ./hub/route ./transport/vless/vision -count=1
          go test -race ./listener/inbound \
            -run '^TestInboundVless_(TLS|Reality)$' -count=1 -parallel=2
